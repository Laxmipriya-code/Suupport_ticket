[project]
name = "support-ticket-ai"
version = "0.1.0"
description = "Evidence-backed support ticket analytics with LangChain and Groq"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pandas>=2.2,<3",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "langchain>=1.0,<2", "langchain-core>=1.0,<2", "langchain-groq>=1.0,<2",
  "groq>=0.30,<1", "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_ticket_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/support_ticket_ai", "run.py"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in Groq network evaluation"]
